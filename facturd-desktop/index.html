  <body>
    <div id="root"></div>
    <script>
      (function () {
        const redirect = sessionStorage.getItem('facturd_pages_redirect');
        if (!redirect) return;
        sessionStorage.removeItem('facturd_pages_redirect');
        const url = new URL(redirect, window.location.origin);
        window.history.replaceState(null, '', url.pathname + url.search + url.hash);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
